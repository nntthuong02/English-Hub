<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập — English Hub</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase App, Firestore & Auth SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 85vh;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 3.2rem; color: var(--primary); margin-bottom: 0.5rem;"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1 style="font-size: 2.3rem; font-weight: 800; color: var(--primary);">English Hub</h1>
      <p style="color: var(--text-muted); font-size: 1.05rem;">Học Tiếng Anh Trực Quan: Từ Vựng Hình Ảnh & 30 Ngày Ngữ Pháp IELTS</p>
    </div>

    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); padding: 2.5rem;">
      <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 1.5rem; text-align: center;">Đăng Nhập Tài Khoản</h2>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div style="margin-bottom: 1.2rem;">
          <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem;">
            <i class="fa-solid fa-envelope" style="color: var(--primary);"></i> Email hoặc Tên đăng nhập:
          </label>
          <input type="text" id="username" class="btn btn-outline" style="width: 100%; text-align: left; background: var(--bg); font-size: 0.95rem; padding: 0.75rem 1rem;" placeholder="Nhập email tài khoản của bạn" required autofocus>
        </div>
        <div style="margin-bottom: 1.8rem;">
          <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem;">
            <i class="fa-solid fa-lock" style="color: var(--primary);"></i> Mật khẩu:
          </label>
          <input type="password" id="password" class="btn btn-outline" style="width: 100%; text-align: left; background: var(--bg); font-size: 0.95rem; padding: 0.75rem 1rem;" placeholder="Nhập mật khẩu" required>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
        </button>
      </form>
      <div id="login-err" style="color: var(--danger); font-size: 0.9rem; margin-top: 1rem; text-align: center; display: none;"></div>
    </div>
  </div>

  <footer>
    English Hub © 2026 — Bảo mật tài khoản với Firebase Authentication.
  </footer>

  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const err = document.getElementById('login-err');
      const btn = document.getElementById('submit-btn');

      err.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';

      const res = await Auth.login(u, p);
      if (res.success) {
        window.location.href = 'dashboard.html';
      } else {
        err.innerText = res.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập';
      }
    }

    if (Auth.getCurrentUser()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
