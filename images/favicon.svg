<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338ca" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="92" height="92" x="4" y="4" rx="22" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Open Book Base -->
  <path d="M 22 62 Q 50 68 50 50 Q 50 68 78 62 L 78 44 Q 50 48 50 34 Q 50 48 22 44 Z" fill="white" opacity="0.95"/>
  <path d="M 50 34 L 50 52" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Graduation Cap -->
  <polygon points="50,20 76,31 50,42 24,31" fill="url(#goldGrad)"/>
  <polygon points="34,36 34,47 50,54 66,47 66,36 50,43" fill="#d97706"/>
  <circle cx="50" cy="20" r="2.5" fill="#fef3c7"/>
  <path d="M 72 33 L 75 48" stroke="#fef3c7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="75" cy="49" r="2" fill="#fbbf24"/>

  <!-- Star Sparkles -->
  <path d="M 70 18 Q 72 23 77 24 Q 72 25 70 30 Q 68 25 63 24 Q 68 23 70 18 Z" fill="#fef08a"/>
</svg>